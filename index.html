<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#F5F2EC">
<title>MoneyLog</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Figtree:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F2EC;--bg2:#EFEBE3;--surface:#FFFFFF;--surface2:#F9F7F4;--surface3:#F0EDE7;
  --border:#E4DFDA;--border2:#D1C9C1;
  --ink:#1C1917;--ink2:#6B645D;--ink3:#A89E96;
  --green:#2C5F3A;--green-lt:#EDF3EF;--green-mid:#C8DDD0;
  --red:#A0291A;--red-lt:#F5ECEA;--red-mid:#E8C4BE;
  --amber:#8A6120;--amber-lt:#F7F0E4;--amber-mid:#DFC99A;
  --blue:#2151A0;--blue-lt:#EBF0F8;
  --purple:#5B4F9A;--purple-lt:#F0EEFB;--purple-mid:#C8C0E8;
  --teal:#1A6B6B;--teal-lt:#E5F3F3;
  --sw:220px;--nh:60px;--mhh:50px;
  --r:12px;--rsm:8px;--rxs:6px;
  --sh0:0 1px 4px rgba(28,25,23,.06),0 2px 10px rgba(28,25,23,.04);
  --sh:0 4px 16px rgba(28,25,23,.08),0 1px 4px rgba(28,25,23,.04);
  --t:.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
input,select,textarea{font-family:'Figtree',sans-serif;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rxs);color:var(--ink);padding:9px 12px;font-size:14px;width:100%;outline:none;transition:border-color var(--t),box-shadow var(--t);}
input:focus,select:focus,textarea:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(28,25,23,.07);}
textarea{resize:vertical;min-height:68px;}
select option{background:#fff;}
a{color:var(--green);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* Mobile header */
#mhd{display:none;position:fixed;top:0;left:0;right:0;height:var(--mhh);background:var(--surface);border-bottom:1px solid var(--border);z-index:110;padding:0 14px;align-items:center;gap:10px;}
.mhbtn{width:34px;height:34px;border-radius:var(--rxs);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2);cursor:pointer;}

/* Sidebar */
#sb{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);position:fixed;left:0;top:0;bottom:0;z-index:100;display:flex;flex-direction:column;}
.sblogo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.logom{width:30px;height:30px;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:15px;font-weight:700;font-family:'Cormorant Garamond',serif;}
.logot{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;}
.sbnav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sbbot{padding:11px 14px;border-top:1px solid var(--border);}
.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rxs);cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500;transition:all var(--t);user-select:none;}
.nv:hover{background:var(--surface2);color:var(--ink);}
.nv.active{background:var(--ink);color:#fff;}
.ni{font-size:13px;width:18px;text-align:center;flex-shrink:0;}

/* Main */
#main{flex:1;margin-left:var(--sw);min-height:100vh;}
#cnt{padding:26px 26px 48px;max-width:940px;width:100%;}
#app{display:flex;min-height:100vh;}

/* Bottom nav */
#bnv{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:var(--surface);border-top:1px solid var(--border);z-index:100;padding:0 2px;justify-content:space-around;align-items:stretch;}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 3px;flex:1;cursor:pointer;color:var(--ink3);font-size:9.5px;font-weight:500;transition:color var(--t);user-select:none;border-radius:8px;margin:4px 1px;}
.bni .bi{font-size:17px;}
.bni.active{color:var(--ink);background:var(--surface3);}

/* FAB */
#fab{position:fixed;bottom:calc(var(--nh)+14px);right:16px;width:46px;height:46px;background:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:var(--sh);cursor:pointer;z-index:90;transition:all var(--t);user-select:none;}
#fab:hover{transform:scale(1.06);}
#fabm{display:none;position:fixed;bottom:calc(var(--nh)+70px);right:16px;flex-direction:column;gap:7px;z-index:89;}
#fabm.open{display:flex;}
.fi{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:8px 15px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--sh0);cursor:pointer;transition:all var(--t);animation:fabIn .2s ease;white-space:nowrap;align-self:flex-end;}
@keyframes fabIn{from{opacity:0;transform:scale(.85) translateY(8px);}}
.fi:hover{background:var(--surface2);}

/* Pages */
.page{display:none;animation:fadeUp .22s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* UI Parts */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;}
.pt{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;line-height:1.1;}
.ps{font-size:12.5px;color:var(--ink3);margin-top:3px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:var(--rxs);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--t);user-select:none;white-space:nowrap;}
.bp{background:var(--ink);color:#fff;}
.bp:hover{background:#333;box-shadow:var(--sh0);}
.bg{background:transparent;color:var(--ink2);border:1px solid var(--border2);}
.bg:hover{background:var(--surface2);color:var(--ink);}
.bd2{background:var(--red-lt);color:var(--red);border:1px solid var(--red-mid);}
.bd2:hover{background:var(--red-mid);}
.sm{padding:5px 11px;font-size:12px;}
.xs{padding:3px 9px;font-size:11px;}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:100px;font-size:10.5px;font-weight:600;}
.bh{background:var(--red-lt);color:var(--red);border:1px solid var(--red-mid);}
.bm{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-mid);}
.bl{background:var(--blue-lt);color:var(--blue);}
.bdn{background:var(--green-lt);color:var(--green);border:1px solid var(--green-mid);}
.bpu{background:var(--purple-lt);color:var(--purple);border:1px solid var(--purple-mid);}
.btl{background:var(--teal-lt);color:var(--teal);}
.fg{margin-bottom:12px;}
.fl{font-size:10.5px;font-weight:700;color:var(--ink3);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fh{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5;}
.cb{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:500;}
.cb input[type=checkbox]{width:auto;}
.amlg{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;letter-spacing:-.5px;line-height:1;}
.pos{color:var(--green);}
.neg{color:var(--red);}
.sr3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:13px 11px;}
.slb{font-size:10px;color:var(--ink3);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.svl{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;}
.si{border-left:2px solid var(--green);}
.se{border-left:2px solid var(--red);}
.sg{border-left:2px solid var(--amber);}
.sa{border-left:2px solid var(--purple);}
.st{border-left:2px solid var(--teal);}
.txl{display:flex;flex-direction:column;}
.txi{display:flex;align-items:center;gap:10px;padding:9px 5px;cursor:pointer;border-bottom:1px solid var(--border);transition:background var(--t);border-radius:4px;}
.txi:last-child{border-bottom:none;}
.txi:hover{background:var(--surface2);}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tdi{background:var(--green);}
.tde{background:var(--red);}
.tdt{background:var(--blue);}
.tico{width:33px;height:33px;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.tinf{flex:1;min-width:0;}
.tnm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tmt{font-size:11px;color:var(--ink3);margin-top:1px;}
.tam{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:500;flex-shrink:0;}
.mnv{display:flex;align-items:center;gap:7px;}
.mnv button{background:var(--surface);border:1px solid var(--border);color:var(--ink2);padding:5px 9px;border-radius:var(--rxs);font-size:13px;cursor:pointer;transition:all var(--t);}
.mnv button:hover{background:var(--surface2);color:var(--ink);}
.mlb{font-size:13px;font-weight:600;min-width:40px;text-align:center;color:var(--ink2);}
.tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rxs);padding:3px;width:fit-content;}
.tab{padding:6px 16px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink3);transition:all var(--t);}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh0);}
.gcrd{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:15px;margin-bottom:12px;}
.gcc{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:26px;flex-shrink:0;}
.gS{background:var(--ink);color:#fff;}
.gA{background:var(--green-lt);color:var(--green);border:2px solid var(--green-mid);}
.gB{background:var(--blue-lt);color:var(--blue);border:2px solid #B8D0EE;}
.gC{background:var(--amber-lt);color:var(--amber);border:2px solid var(--amber-mid);}
.gD{background:var(--red-lt);color:var(--red);border:2px solid var(--red-mid);}
.gi{flex:1;}
.gt{font-size:14px;font-weight:600;margin-bottom:2px;}
.gm{font-size:12.5px;color:var(--ink2);}
.pt2{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:7px;}
.pf{height:100%;border-radius:2px;transition:width .6s ease;}
.acg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;margin-bottom:14px;}
.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:box-shadow var(--t),transform var(--t);}
.acc:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.ach{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.acico{width:35px;height:35px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.acn{font-size:14px;font-weight:600;}
.act{font-size:11px;color:var(--ink3);}
.acbal{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;}
.acini{font-size:11px;color:var(--ink3);margin-top:3px;}
.sw2{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.sw3{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform var(--t);}
.sw3:hover{transform:scale(1.15);}
.sw3.sel{border-color:var(--ink);transform:scale(1.1);}
.nwb{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:12px;}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:11px;}
.wc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:box-shadow var(--t),transform var(--t);}
.wc:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.wc.pur{opacity:.55;}
.wn{font-size:14.5px;font-weight:600;margin-bottom:5px;line-height:1.3;}
.wp{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-bottom:7px;}
.wtg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
.chwrap{position:relative;width:100%;}
.chwrap canvas{max-height:210px;}
.fls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.flb{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:14px;}
.fll{font-size:10px;color:var(--ink3);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.flv{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;}
.srcr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.srcr:last-child{border-bottom:none;}
.sbar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.sbf{height:100%;background:var(--green);border-radius:2px;transition:width .5s ease;}
/* Sync panel */
.sync-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.sync-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex-shrink:0;}
.sdot.ok{background:var(--green);}
.sdot.err{background:var(--red);}
.sdot.ing{background:var(--amber);animation:pulse .8s infinite alternate;}
@keyframes pulse{to{opacity:.4;}}
.stxt{font-size:12.5px;color:var(--ink3);}
.stxt.ok{color:var(--green);}
.stxt.err{color:var(--red);}
/* Modal */
#mov{display:none;position:fixed;inset:0;background:rgba(28,25,23,.38);backdrop-filter:blur(3px);z-index:200;align-items:flex-end;justify-content:center;}
#mov.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:520px;max-height:94vh;overflow-y:auto;padding:20px 20px 26px;box-shadow:0 -8px 32px rgba(28,25,23,.1);animation:slUp .28s cubic-bezier(.32,.72,0,1);}
@keyframes slUp{from{transform:translateY(100%);}}
.mhd2{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.mtt{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;}
.mcl{font-size:19px;color:var(--ink3);cursor:pointer;width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:all var(--t);}
.mcl:hover{background:var(--surface2);color:var(--ink);}
.mact{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.cscr{overflow-x:auto;margin-bottom:12px;padding-bottom:3px;}
.chips{display:flex;gap:5px;min-width:max-content;}
.chip{padding:4px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all var(--t);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.chip:hover{border-color:var(--border2);color:var(--ink);background:var(--surface2);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.ctag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;background:var(--surface2);border:1px solid var(--border);font-size:12px;}
.dbt{color:var(--ink3);font-size:13px;cursor:pointer;transition:color var(--t);}
.dbt:hover{color:var(--red);}
#toasts{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--ink);color:#fff;padding:9px 15px;border-radius:var(--rxs);font-size:13px;font-weight:500;box-shadow:var(--sh);animation:tIn .22s ease;max-width:280px;}
@keyframes tIn{from{opacity:0;transform:translateX(14px);}}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}
.emp{text-align:center;padding:40px 20px;}
.eico{font-size:34px;margin-bottom:9px;}
.emsg{font-size:13.5px;font-weight:500;color:var(--ink2);}
.esub{font-size:12px;margin-top:4px;color:var(--ink3);}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg);}}
.div{height:1px;background:var(--border);margin:12px 0;}
.sec-h{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.info-box{background:var(--amber-lt);border:1px solid var(--amber-mid);border-radius:var(--rxs);padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--amber);}
.info-box strong{color:var(--ink);}
@media(max-width:767px){
  #sb{display:none!important;}
  #mhd{display:flex;}
  #main{margin-left:0;}
  #bnv{display:flex;}
  #cnt{padding:calc(var(--mhh)+14px) 13px 70px;}
  .sr3{gap:7px;}
  .wg{grid-template-columns:1fr 1fr;gap:9px;}
  .fr2{grid-template-columns:1fr;gap:0;}
  .pt{font-size:23px;}
  .amlg{font-size:32px;}
  .acg{grid-template-columns:1fr 1fr;}
  .fls{grid-template-columns:1fr 1fr;}
}
@media(max-width:420px){
  .wg{grid-template-columns:1fr;}
  .acg{grid-template-columns:1fr;}
  .fls{grid-template-columns:1fr;}
}
@media(min-width:768px){
  #mov{align-items:center;}
  .modal{border-radius:var(--r);animation:mFd .2s ease;}
  @keyframes mFd{from{opacity:0;transform:scale(.97) translateY(4px);}}
  #fab,#fabm{display:none!important;}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sb">
    <div class="sblogo">
      <div class="logom">M</div>
      <span class="logot">MoneyLog</span>
    </div>
    <div class="sbnav">
      <div class="nv active" data-page="home"><span class="ni">⊞</span>ホーム</div>
      <div class="nv" data-page="assets"><span class="ni">◫</span>資産・口座</div>
      <div class="nv" data-page="income"><span class="ni">↑</span>収入</div>
      <div class="nv" data-page="expense"><span class="ni">↓</span>支出・経費</div>
      <div class="nv" data-page="report"><span class="ni">◈</span>レポート</div>
      <div class="nv" data-page="wishlist"><span class="ni">◇</span>ほしい物</div>
      <div class="nv" data-page="settings"><span class="ni">◎</span>設定</div>
    </div>
    <div class="sbbot" id="sb-sync"></div>
  </nav>
  <div id="main">
    <div id="cnt">
      <div id="page-home"     class="page active"></div>
      <div id="page-assets"   class="page"></div>
      <div id="page-income"   class="page"></div>
      <div id="page-expense"  class="page"></div>
      <div id="page-report"   class="page"></div>
      <div id="page-wishlist" class="page"></div>
      <div id="page-settings" class="page"></div>
    </div>
  </div>
  <nav id="bnv">
    <div class="bni active" data-page="home"><span class="bi">⊞</span>ホーム</div>
    <div class="bni" data-page="assets"><span class="bi">◫</span>資産</div>
    <div class="bni" data-page="expense"><span class="bi">↓</span>支出</div>
    <div class="bni" data-page="report"><span class="bi">◈</span>レポート</div>
    <div class="bni" data-page="wishlist"><span class="bi">◇</span>ほしい物</div>
  </nav>
</div>
<div id="mhd">
  <div class="sblogo" style="padding:0;border:none;flex:1;">
    <div class="logom">M</div><span class="logot">MoneyLog</span>
  </div>
  <div class="mhbtn" onclick="nav('settings')">⚙</div>
</div>
<div id="fab" onclick="toggleFab()">＋</div>
<div id="fabm">
  <div class="fi" onclick="openModal('expense',null)">↓ 支出を追加</div>
  <div class="fi" onclick="openModal('income',null)">↑ 収入を追加</div>
  <div class="fi" onclick="openModal('transfer',null)">⇄ 振替・送金</div>
  <div class="fi" onclick="openModal('wish',null)">◇ ほしい物を追加</div>
</div>
<div id="mov" onclick="ovClick(event)">
  <div class="modal" id="mini"></div>
</div>
<div id="toasts"></div>

<script>
'use strict';
/* ── Constants ── */
const ICONS={食費:'🛒',外食:'🍜',交通費:'🚃',住居費:'🏠',光熱費:'💡',通信費:'📱',医療費:'💊',衣類:'👔',娯楽:'🎮',日用品:'🧴',教育:'📚',貯蓄:'🏦','その他支出':'📦',給与:'💼',副業:'🔧',フリーランス:'💻',投資:'📈','その他収入':'💵','通信費(経費)':'📡','交通費(経費)':'🚉','機材・ソフト':'🖥','書籍・資料':'📖',外注費:'🤝',広告費:'📣',会議費:'☕','その他経費':'📋'};
const ACCT_T={bank:{l:'銀行口座',i:'🏦'},cash:{l:'現金',i:'💴'},ic:{l:'ICカード',i:'🚃'},invest:{l:'投資口座',i:'📈'},credit:{l:'クレジット',i:'💳'},other:{l:'その他',i:'💼'}};
const COLORS=['#2C5F3A','#2151A0','#8A6120','#A0291A','#5B4F9A','#1A6B6B','#555555','#7A3B1E'];
const DEF_EC=['食費','外食','交通費','住居費','光熱費','通信費','医療費','衣類','娯楽','日用品','教育','貯蓄','その他支出','通信費(経費)','交通費(経費)','機材・ソフト','書籍・資料','外注費','広告費','会議費','その他経費'];
const DEF_IC=['給与','副業','フリーランス','投資','その他収入'];
const LSKEY='ml4';

/* ── State ── */
let S={
  page:'home',vm:new Date(),rp:'month',repTab:'summary',
  fabOpen:false,ef:'all',eKei:false,ifree:false,
  sync:{status:'idle',lastAt:null,pushing:false},
  data:{accounts:[],incomes:[],expenses:[],transfers:[],wishlist:[],ec:[...DEF_EC],ic:[...DEF_IC],
        cfg:{binId:'',binKey:''}}
};

/* ── Local storage ── */
function saveLocal(){localStorage.setItem(LSKEY,JSON.stringify(S.data));}
function loadLocal(){
  try{
    const r=localStorage.getItem(LSKEY);
    if(!r)return;
    const p=JSON.parse(r);
    S.data={...S.data,...p};
    if(!S.data.ec?.length)S.data.ec=[...DEF_EC];
    if(!S.data.ic?.length)S.data.ic=[...DEF_IC];
    if(!S.data.cfg)S.data.cfg={binId:'',binKey:''};
    // migrate old cfg key names
    if(S.data.cfg.gistId!==undefined){
      delete S.data.cfg.gistId;delete S.data.cfg.token;delete S.data.cfg.akey;}
    if(!S.data.accounts)S.data.accounts=[];
    if(!S.data.transfers)S.data.transfers=[];
  }catch(e){}
}

/* ── JSONBin sync ── */
const JBIN='https://api.jsonbin.io/v3';
let pushTimer=null;

function schedulePush(){
  const{binId,binKey}=S.data.cfg;
  if(!binId||!binKey)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>pushBin(),5000);
}

async function pullBin(){
  const{binId,binKey}=S.data.cfg;
  if(!binId||!binKey){toast('JSONBinの設定が必要です','err');return;}
  setSyncUI('ing');
  try{
    const r=await fetch(`${JBIN}/b/${binId}/latest`,{
      headers:{'X-Master-Key':binKey}
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const d=j.record||{};
    if(d.incomes)  S.data.incomes  =merge(S.data.incomes,  d.incomes);
    if(d.expenses) S.data.expenses =merge(S.data.expenses, d.expenses);
    if(d.wishlist) S.data.wishlist =merge(S.data.wishlist, d.wishlist);
    if(d.accounts) S.data.accounts =merge(S.data.accounts, d.accounts);
    if(d.transfers)S.data.transfers=merge(S.data.transfers,d.transfers);
    if(d.ec)S.data.ec=d.ec;
    if(d.ic)S.data.ic=d.ic;
    saveLocal();setSyncUI('ok');renderSyncUI();toast('同期しました','ok');renderPage();
  }catch(e){setSyncUI('err',e.message);toast('取得エラー: '+e.message,'err');}
}

async function pushBin(){
  const{binId,binKey}=S.data.cfg;
  if(!binId||!binKey)return;
  setSyncUI('ing');
  try{
    const payload={
      incomes:S.data.incomes,expenses:S.data.expenses,
      wishlist:S.data.wishlist,accounts:S.data.accounts,
      transfers:S.data.transfers,ec:S.data.ec,ic:S.data.ic,
      savedAt:new Date().toISOString()
    };
    const r=await fetch(`${JBIN}/b/${binId}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':binKey},
      body:JSON.stringify(payload)
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    S.sync.lastAt=new Date();
    setSyncUI('ok');renderSyncUI();
  }catch(e){setSyncUI('err',e.message);}
}

async function createBin(){
  const{binKey}=S.data.cfg;
  if(!binKey){toast('Master Keyを先に入力してください','err');return;}
  setSyncUI('ing');
  try{
    const r=await fetch(`${JBIN}/b`,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':binKey,'X-Bin-Name':'MoneyLog'},
      body:JSON.stringify({init:true})
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    S.data.cfg.binId=j.metadata.id;
    saveLocal();setSyncUI('ok');renderSyncUI();toast('Bin作成しました。IDを保存してください','ok');
    if(S.page==='settings')rSets();
  }catch(e){setSyncUI('err',e.message);toast('作成エラー: '+e.message,'err');}
}

function merge(loc,rem){
  if(!Array.isArray(rem))return loc;
  const m={};
  [...loc,...rem].forEach(x=>{
    if(x&&x.id&&(!m[x.id]||(x.updatedAt||'')>(m[x.id].updatedAt||'')))m[x.id]=x;
  });
  return Object.values(m).filter(x=>!x._del);
}

function save(){saveLocal();schedulePush();}

/* ── Sync UI ── */
function setSyncUI(s,msg=''){S.sync.status=s;S.sync.msg=msg;}
function renderSyncUI(){
  const el=document.getElementById('sb-sync');
  if(!el)return;
  const{status,lastAt,msg}=S.sync;
  const{binId}=S.data.cfg;
  const dotC=status==='ok'?'ok':status==='err'?'err':status==='ing'?'ing':'';
  const txt=status==='ok'?`同期済み${lastAt?' '+lastAt.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):''}`:
    status==='err'?`エラー: ${msg||''}`:status==='ing'?'同期中…':
    binId?'未同期':'未設定';
  const col=status==='ok'?'ok':status==='err'?'err':'';
  el.innerHTML=`<div style="display:flex;align-items:center;gap:6px;"><div class="sdot ${dotC}"></div><span class="stxt ${col}" style="font-size:11.5px;">${txt}</span></div>`;
}

/* ── Nav ── */
function nav(p){
  S.page=p;closeFab();
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll(`[data-page="${p}"]`).forEach(x=>x.classList.add('active'));
  document.getElementById(`page-${p}`)?.classList.add('active');
  renderPage();window.scrollTo(0,0);
}
function renderPage(){
  switch(S.page){
    case'home':    rHome();break;
    case'assets':  rAssets();break;
    case'income':  rIncome();break;
    case'expense': rExpense();break;
    case'report':  rReport();break;
    case'wishlist':rWish();break;
    case'settings':rSets();break;
  }
  renderSyncUI();
}

/* ── Utilities ── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function yen(n){return'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');}
function today(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function mRng(d){const y=d.getFullYear(),m=d.getMonth();return{s:fmt(new Date(y,m,1)),e:fmt(new Date(y,m+1,0))};}
function wRng(){const dt=new Date(),day=dt.getDay();const mo=new Date(dt);mo.setDate(dt.getDate()-(day===0?6:day-1));const su=new Date(mo);su.setDate(mo.getDate()+6);return{s:fmt(mo),e:fmt(su)};}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function inR(ds,s,e){return ds>=s&&ds<=e;}
function fd(ds){const d=new Date(ds+'T00:00:00');return`${d.getMonth()+1}/${d.getDate()}`;}
function dlTxt(dl){if(!dl)return null;const df=Math.ceil((new Date(dl)-new Date())/86400000);if(df<0)return'期限切れ';if(df===0)return'今日';if(df<=7)return`残${df}日`;if(df<=30)return`残${Math.ceil(df/7)}週`;return`残${Math.ceil(df/30)}ヶ月`;}
function grade(r){
  if(r>=30)return{g:'S',c:'gS',msg:'素晴らしい貯蓄率です！',col:'var(--ink)'};
  if(r>=20)return{g:'A',c:'gA',msg:'良好な管理ができています',col:'var(--green)'};
  if(r>=10)return{g:'B',c:'gB',msg:'まずまず。もう少し頑張ろう',col:'var(--blue)'};
  if(r>=0) return{g:'C',c:'gC',msg:'収支トントン。節約を意識しよう',col:'var(--amber)'};
  return{g:'D',c:'gD',msg:'赤字です。支出を見直しましょう',col:'var(--red)'};}
function ci(c){return ICONS[c]||'📌';}
function emp(ic,msg,sub=''){return`<div class="emp"><div class="eico">${ic}</div><div class="emsg">${msg}</div>${sub?`<div class="esub">${sub}</div>`:''}</div>`;}
function gv(id){return document.getElementById(id)?.value||'';}
function gb(id){return!!document.getElementById(id)?.checked;}
function nowIso(){return new Date().toISOString();}
function aIcon(t){return ACCT_T[t]?.i||'💼';}
function aLabel(t){return ACCT_T[t]?.l||'その他';}
function aName(id){return S.data.accounts.find(x=>x.id===id)?.name||'−';}
function acctBal(a){
  const id=a.id;
  const inc=S.data.incomes.filter(x=>x.accountId===id).reduce((s,x)=>s+x.amount,0);
  const exp=S.data.expenses.filter(x=>x.accountId===id).reduce((s,x)=>s+x.amount,0);
  const tin=S.data.transfers.filter(x=>x.toId===id).reduce((s,x)=>s+x.amount,0);
  const tout=S.data.transfers.filter(x=>x.fromId===id).reduce((s,x)=>s+x.amount,0);
  return(a.initialBalance||0)+inc-exp+tin-tout;
}
function netWorth(){return S.data.accounts.reduce((s,a)=>s+acctBal(a),0);}
function acctOpts(sel){return'<option value="">− 未設定 −</option>'+S.data.accounts.map(a=>`<option value="${a.id}"${sel===a.id?' selected':''}>${aIcon(a.type)} ${a.name}</option>`).join('');}

/* ── Toast ── */
function toast(msg,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>{el.style.cssText='opacity:0;transform:translateX(14px);transition:all .25s';setTimeout(()=>el.remove(),250);},2800);}

/* ── FAB ── */
function toggleFab(){S.fabOpen=!S.fabOpen;document.getElementById('fab').textContent=S.fabOpen?'✕':'＋';document.getElementById('fabm').classList.toggle('open',S.fabOpen);}
function closeFab(){S.fabOpen=false;const f=document.getElementById('fab'),m=document.getElementById('fabm');if(f)f.textContent='＋';if(m)m.classList.remove('open');}
document.addEventListener('click',e=>{if(S.fabOpen&&!e.target.closest('#fab')&&!e.target.closest('#fabm'))closeFab();});

/* ── Modal ── */
// editingId stores the ID being edited to avoid string-in-HTML issues
let editingId=null;
function openModal(type,id){
  closeFab();
  editingId=id||null;
  document.getElementById('mov').classList.add('open');
  const inn=document.getElementById('mini');
  if(type==='expense') inn.innerHTML=mExp(editingId);
  else if(type==='income')   inn.innerHTML=mInc(editingId);
  else if(type==='wish')     inn.innerHTML=mWish(editingId);
  else if(type==='acct')     inn.innerHTML=mAcct(editingId);
  else if(type==='transfer') inn.innerHTML=mXfr(editingId);
}
function closeModal(){document.getElementById('mov').classList.remove('open');editingId=null;}
function ovClick(e){if(e.target===document.getElementById('mov'))closeModal();}

/* ── tx row ── */
function txRow(tx){
  const isI=tx.type==='income',isT=tx.type==='transfer';
  const cat=tx.category||'';
  const dotC=isI?'tdi':isT?'tdt':'tde';
  const amtC=isI?'pos':isT?'':'neg';
  const sign=isI?'+':isT?'⇄':'−';
  const name=isT?`${aName(tx.fromId)} → ${aName(tx.toId)}`:tx.memo||cat;
  const meta=isT?`${fd(tx.date)} · 振替`:`${fd(tx.date)} · ${cat}${tx.accountId?' · '+aName(tx.accountId):''}`;
  const kb=tx.isKeiei?'<span class="badge bpu" style="font-size:9px;padding:1px 5px;margin-left:3px;">経費</span>':'';
  const fb=tx.isFreelance?'<span class="badge btl" style="font-size:9px;padding:1px 5px;margin-left:3px;">FL</span>':'';
  const mtype=isT?'transfer':tx.type;
  return`<div class="txi" data-mtype="${mtype}" data-id="${tx.id}">
    <div class="tdot ${dotC}"></div>
    <div class="tico">${isT?'⇄':ci(cat)}</div>
    <div class="tinf"><div class="tnm">${name}${kb}${fb}</div><div class="tmt">${meta}</div></div>
    <div class="tam ${amtC}">${isT?yen(tx.amount):sign+yen(tx.amount)}</div>
  </div>`;
}
// delegated click on tx rows
document.addEventListener('click',e=>{
  const row=e.target.closest('.txi[data-mtype]');
  if(row){openModal(row.dataset.mtype,row.dataset.id||null);}
});

/* ── HOME ── */
function rHome(){
  const rng=mRng(S.vm);
  const inc=S.data.incomes.filter(x=>inR(x.date,rng.s,rng.e));
  const exp=S.data.expenses.filter(x=>inR(x.date,rng.s,rng.e));
  const tI=inc.reduce((s,x)=>s+x.amount,0),tE=exp.reduce((s,x)=>s+x.amount,0),bal=tI-tE;
  const rate=tI>0?Math.round(bal/tI*100):0;const g=grade(rate);
  const nw=netWorth();
  const all=[
    ...inc.map(x=>({...x,type:'income'})),
    ...exp.map(x=>({...x,type:'expense'})),
    ...S.data.transfers.filter(x=>inR(x.date,rng.s,rng.e)).map(x=>({...x,type:'transfer'}))
  ].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  const ml=`${S.vm.getFullYear()}年${S.vm.getMonth()+1}月`;
  document.getElementById('page-home').innerHTML=`
    <div class="ph">
      <div><div class="pt">ダッシュボード</div><div class="ps">${ml}</div></div>
      <div class="mnv"><button onclick="chM(-1)">‹</button><span class="mlb">${S.vm.getMonth()+1}月</span><button onclick="chM(1)">›</button></div>
    </div>
    ${S.data.accounts.length>0?`<div class="nwb">
      <div class="slb">総資産</div>
      <div class="amlg ${nw>=0?'pos':'neg'}" style="margin:5px 0 11px;">${yen(nw)}</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;">${S.data.accounts.map(a=>{const b=acctBal(a);return`<div style="display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:3px 11px;font-size:12px;"><span>${aIcon(a.type)}</span><span style="font-weight:500;">${a.name}</span><span style="font-family:'DM Mono',monospace;color:${b>=0?'var(--green)':'var(--red)'};">${yen(b)}</span></div>`;}).join('')}</div>
    </div>`:''}
    <div class="card" style="padding:20px 22px;">
      <div class="slb">今月の収支</div>
      <div class="amlg ${bal>=0?'pos':'neg'}" style="margin:6px 0 10px;">${yen(bal)}</div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:5px;">貯蓄率 <strong style="color:${g.col}">${rate}%</strong></div>
      <div class="pt2"><div class="pf" style="width:${Math.max(0,Math.min(100,rate))}%;background:${bal>=0?'var(--green)':'var(--red)'}"></div></div>
    </div>
    <div class="sr3">
      <div class="sbox si"><div class="slb">収入</div><div class="svl pos">${yen(tI)}</div></div>
      <div class="sbox se"><div class="slb">支出</div><div class="svl neg">${yen(tE)}</div></div>
      <div class="sbox sg"><div class="slb">評価</div><div class="svl" style="color:${g.col}">${g.g}</div></div>
    </div>
    <div class="gcrd"><div class="gcc ${g.c}">${g.g}</div><div class="gi"><div class="gt">${ml}の評価</div><div class="gm">${g.msg}</div></div></div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span style="font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;">最近の取引</span>
        <span style="font-size:11px;color:var(--ink3)">${all.length}件</span>
      </div>
      <div class="txl">${all.length===0?emp('📭','まだ記録がありません'):all.map(txRow).join('')}</div>
    </div>`;
}
function chM(d){const dt=new Date(S.vm);dt.setMonth(dt.getMonth()+d);S.vm=dt;renderPage();}

/* ── ASSETS ── */
function rAssets(){
  const nw=netWorth();
  const xfrs=S.data.transfers.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  document.getElementById('page-assets').innerHTML=`
    <div class="ph">
      <div><div class="pt">資産・口座</div><div class="ps">総資産 ${yen(nw)}</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn bg sm" onclick="openModal('transfer',null)">⇄ 振替</button>
        <button class="btn bp sm" onclick="openModal('acct',null)">＋ 追加</button>
      </div>
    </div>
    <div class="nwb"><div class="slb">総資産</div><div class="amlg ${nw>=0?'pos':'neg'}" style="margin-top:5px;">${yen(nw)}</div></div>
    ${S.data.accounts.length===0?emp('◫','口座がありません','「＋ 追加」から設定してください'):`
    <div class="acg">${S.data.accounts.map(a=>{const b=acctBal(a);return`<div class="acc" data-mtype="acct" data-id="${a.id}">
      <div class="ach">
        <div class="acico" style="background:${a.color||'#eee'}20;border:1px solid ${a.color||'#ccc'}40;">${aIcon(a.type)}</div>
        <div><div class="acn">${a.name}</div><div class="act">${aLabel(a.type)}</div></div>
      </div>
      <div class="acbal ${b>=0?'pos':'neg'}">${yen(b)}</div>
      <div class="acini">初期残高: ${yen(a.initialBalance||0)}</div>
    </div>`;}).join('')}</div>`}
    ${xfrs.length>0?`<div class="card"><div style="font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;">最近の振替</div><div class="txl">${xfrs.map(x=>txRow({...x,type:'transfer'})).join('')}</div></div>`:''}`;
}

/* ── INCOME ── */
function rIncome(){
  const rng=mRng(S.vm);
  let items=S.data.incomes.filter(x=>inR(x.date,rng.s,rng.e));
  const allT=items.reduce((s,x)=>s+x.amount,0);
  const flT=items.filter(x=>x.isFreelance).reduce((s,x)=>s+x.amount,0);
  if(S.ifree)items=items.filter(x=>x.isFreelance);
  items.sort((a,b)=>b.date.localeCompare(a.date));
  const byC={};items.forEach(x=>{byC[x.category]=(byC[x.category]||0)+x.amount;});
  const ml=`${S.vm.getFullYear()}年${S.vm.getMonth()+1}月`;
  document.getElementById('page-income').innerHTML=`
    <div class="ph">
      <div><div class="pt">収入</div><div class="ps">${ml}</div></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="mnv"><button onclick="chM(-1)">‹</button><span class="mlb">${S.vm.getMonth()+1}月</span><button onclick="chM(1)">›</button></div>
        <button class="btn bp sm" onclick="openModal('income',null)">＋ 追加</button>
      </div>
    </div>
    <div class="sr3">
      <div class="sbox si"><div class="slb">合計収入</div><div class="svl pos">${yen(allT)}</div></div>
      <div class="sbox st"><div class="slb">フリーランス</div><div class="svl" style="color:var(--teal)">${yen(flT)}</div></div>
      <div class="sbox" style="border-left:2px solid var(--ink3)"><div class="slb">その他</div><div class="svl">${yen(allT-flT)}</div></div>
    </div>
    <div style="display:flex;gap:7px;margin-bottom:12px;">
      <div class="chip ${!S.ifree?'on':''}" onclick="S.ifree=false;rIncome()">すべて</div>

/* ── Modals ── */
function swHtml(sel){return`<div class="sw2">${COLORS.map(c=>`<div class="sw3 ${sel===c?'sel':''}" style="background:${c};" onclick="pickColor(this,'${c}')"></div>`).join('')}</div>`;}
function pickColor(el,c){document.getElementById('acol').value=c;document.querySelectorAll('.sw3').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');}

function mAcct(id){
  const item=id?S.data.accounts.find(x=>x.id===id):null;
  const v=item||{name:'',type:'bank',initialBalance:0,color:COLORS[0]};
  return`<div class="mhd2"><div class="mtt">${item?'口座を編集':'口座を追加'}</div><div class="mcl" onclick="closeModal()">×</div></div>
    <div class="fg"><label class="fl">口座名</label><input type="text" id="aname" value="${v.name}" placeholder="例：楽天銀行、財布、Suica"></div>
    <div class="fg"><label class="fl">種別</label><select id="atype">${Object.entries(ACCT_T).map(([k,o])=>`<option value="${k}"${v.type===k?' selected':''}>${o.i} ${o.l}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">初期残高（現在の実際の残高）</label><input type="number" id="ainit" value="${v.initialBalance||0}" inputmode="decimal"><div class="fh">現在の残高を入力してください。収入には換算されません。</div></div>
    <div class="fg"><label class="fl">カラー</label><input type="hidden" id="acol" value="${v.color||COLORS[0]}">${swHtml(v.color||COLORS[0])}</div>
    <div class="mact">
      ${item?`<button class="btn bd2 sm" onclick="delItem('acct','${id}')">削除</button>`:''}
      <button class="btn bg" onclick="closeModal()">キャンセル</button>
      <button class="btn bp" onclick="saveAcct()">保存</button>
    </div>`;
}

function mXfr(id){
  const item=id?S.data.transfers.find(x=>x.id===id):null;
  const v=item||{date:today(),amount:'',fromId:'',toId:'',memo:''};
  return`<div class="mhd2"><div class="mtt">${item?'振替を編集':'振替・送金'}</div><div class="mcl" onclick="closeModal()">×</div></div>
    <div class="fr2">
      <div class="fg"><label class="fl">日付</label><input type="date" id="xd" value="${v.date}"></div>
      <div class="fg"><label class="fl">金額 (¥)</label><input type="number" id="xa" value="${v.amount||''}" placeholder="0" min="0" inputmode="decimal"></div>
    </div>
    <div class="fg"><label class="fl">送金元</label><select id="xf">${acctOpts(v.fromId)}</select></div>
    <div class="fg"><label class="fl">送金先</label><select id="xt">${acctOpts(v.toId)}</select></div>
    <div class="fg"><label class="fl">メモ（任意）</label><input type="text" id="xm" value="${v.memo||''}" placeholder="例：給与振り込み、Suicaチャージ"></div>
    <div class="mact">
      ${item?`<button class="btn bd2 sm" onclick="delItem('transfer','${id}')">削除</button>`:''}
      <button class="btn bg" onclick="closeModal()">キャンセル</button>
      <button class="btn bp" onclick="saveXfr()">保存</button>
    </div>`;
}

  const item=id?S.data.expenses.find(x=>x.id===id):null;
  const v=item||{date:today(),amount:'',category:S.data.ec[0]||'食費',accountId:'',memo:'',detail:'',isKeiei:false};
  return`<div class="mhd2"><div class="mtt">${item?'支出を編集':'支出を追加'}</div><div class="mcl" onclick="closeModal()">×</div></div>
    <div class="fr2">
      <div class="fg"><label class="fl">日付</label><input type="date" id="md" value="${v.date}"></div>
      <div class="fg"><label class="fl">金額 (¥)</label><input type="number" id="ma" value="${v.amount||''}" placeholder="0" min="0" inputmode="decimal"></div>
    </div>
    <div class="fg"><label class="fl">カテゴリ</label><select id="mc">${S.data.ec.map(c=>`<option${v.category===c?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">口座</label><select id="macc">${acctOpts(v.accountId)}</select></div>
    <div class="fg"><label class="fl">メモ</label><input type="text" id="mm" value="${v.memo||''}" placeholder="店名・商品名など"></div>
    <div class="fg"><label class="fl">詳細（任意）</label><textarea id="mdt" placeholder="内訳など">${v.detail||''}</textarea></div>
    <div class="fg" style="background:var(--purple-lt);border:1px solid var(--purple-mid);border-radius:var(--rxs);padding:12px;">
      <label class="cb"><input type="checkbox" id="mkei"${v.isKeiei?' checked':''}><span>経費として計上する（フリーランス事業経費）</span></label>
    </div>
    <div class="mact">
      ${item?`<button class="btn bd2 sm" onclick="delItem('expense','${id}')">削除</button>`:''}
      <button class="btn bg" onclick="closeModal()">キャンセル</button>
      <button class="btn bp" onclick="saveE()">保存</button>
    </div>`;

function mInc(id){
  const item=id?S.data.incomes.find(x=>x.id===id):null;
  const v=item||{date:today(),amount:'',category:S.data.ic[0]||'給与',accountId:'',memo:'',isFreelance:false,clientName:''};
  return`<div class="mhd2"><div class="mtt">${item?'収入を編集':'収入を追加'}</div><div class="mcl" onclick="closeModal()">×</div></div>
    <div class="fr2">
      <div class="fg"><label class="fl">日付</label><input type="date" id="md" value="${v.date}"></div>
      <div class="fg"><label class="fl">金額 (¥)</label><input type="number" id="ma" value="${v.amount||''}" placeholder="0" min="0" inputmode="decimal"></div>
    </div>
    <div class="fg"><label class="fl">カテゴリ</label><select id="mc">${S.data.ic.map(c=>`<option${v.category===c?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">口座（振込先）</label><select id="macc">${acctOpts(v.accountId)}</select></div>
    <div class="fg"><label class="fl">メモ</label><input type="text" id="mm" value="${v.memo||''}" placeholder="備考"></div>

      <div id="clrow" style="${v.isFreelance?'':'display:none;'}margin-top:8px;">

        <input type="text" id="mcl" value="${v.clientName||''}" placeholder="クライアント・会社名">
      </div>
    </div>
    <div class="mact">
      ${item?`<button class="btn bd2 sm" onclick="delItem('income','${id}')">削除</button>`:''}
      <button class="btn bg" onclick="closeModal()">キャンセル</button>
      <button class="btn bp" onclick="saveI()">保存</button>
    </div>`;
}
function toggleCl(){const v=gb('mfree');const r=document.getElementById('clrow');if(r)r.style.display=v?'':'none';}

function mWish(id){
  const item=id?S.data.wishlist.find(x=>x.id===id):null;
  const v=item||{name:'',price:'',priority:'mid',deadline:'',url:'',memo:'',status:'considering'};
  return`<div class="mhd2"><div class="mtt">${item?'ほしい物を編集':'ほしい物を追加'}</div><div class="mcl" onclick="closeModal()">×</div></div>
    <div class="fg"><label class="fl">商品名</label><input type="text" id="mn" value="${v.name}" placeholder="何がほしい？"></div>
    <div class="fr2">
      <div class="fg"><label class="fl">価格 (¥)</label><input type="number" id="mp" value="${v.price||''}" placeholder="0" min="0" inputmode="decimal"></div>
      <div class="fg"><label class="fl">重要度</label><select id="mpr"><option value="high"${v.priority==='high'?' selected':''}>高</option><option value="mid"${v.priority==='mid'?' selected':''}>中</option><option value="low"${v.priority==='low'?' selected':''}>低</option></select></div>
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl">購入希望日</label><input type="date" id="mdl" value="${v.deadline||''}"></div>
      <div class="fg"><label class="fl">ステータス</label><select id="mst"><option value="considering"${v.status==='considering'?' selected':''}>検討中</option><option value="planned"${v.status==='planned'?' selected':''}>購入予定</option><option value="purchased"${v.status==='purchased'?' selected':''}>購入済み</option></select></div>
    </div>
    <div class="fg"><label class="fl">URL（任意）</label><input type="url" id="mu" value="${v.url||''}" placeholder="https://..."></div>
    <div class="fg"><label class="fl">メモ</label><textarea id="mm" placeholder="理由・コメントなど">${v.memo||''}</textarea></div>
    <div class="mact">
      ${item?`<button class="btn bd2 sm" onclick="delItem('wish','${id}')">削除</button>`:''}
      <button class="btn bg" onclick="closeModal()">キャンセル</button>
      <button class="btn bp" onclick="saveW()">保存</button>
    </div>`;
}

/* ── CRUD — all use editingId (no string-in-onclick) ── */
function saveAcct(){
  const name=gv('aname').trim(),type=gv('atype'),initialBalance=parseFloat(gv('ainit'))||0,color=gv('acol')||COLORS[0];
  if(!name){toast('口座名を入力してください','err');return;}
  const n=nowIso(),id=editingId;
  if(id){const i=S.data.accounts.findIndex(x=>x.id===id);if(i>-1)S.data.accounts[i]={...S.data.accounts[i],name,type,initialBalance,color,updatedAt:n};}
  else S.data.accounts.push({id:uid(),name,type,initialBalance,color,createdAt:n,updatedAt:n});
  save();closeModal();toast(id?'口座を更新しました':'口座を追加しました','ok');renderPage();
}
function saveXfr(){
  const date=gv('xd'),amount=parseFloat(gv('xa')),fromId=gv('xf'),toId=gv('xt'),memo=gv('xm').trim();
  if(!date||!amount||amount<=0){toast('日付と金額を入力してください','err');return;}
  if(fromId&&toId&&fromId===toId){toast('送金元と送金先が同じです','err');return;}
  const n=nowIso(),id=editingId;
  if(id){
    const i=S.data.transfers.findIndex(x=>x.id===id);
    if(i>-1)S.data.transfers[i]={...S.data.transfers[i],date,amount,fromId,toId,memo,updatedAt:n};
    else S.data.transfers.push({id:uid(),date,amount,fromId,toId,memo,createdAt:n,updatedAt:n});
  }else{
    S.data.transfers.push({id:uid(),date,amount,fromId,toId,memo,createdAt:n,updatedAt:n});
  }
  save();closeModal();toast('振替を記録しました','ok');renderPage();
}
function saveE(){
  const date=gv('md'),amount=parseFloat(gv('ma')),category=gv('mc'),accountId=gv('macc'),memo=gv('mm').trim(),detail=gv('mdt').trim(),isKeiei=gb('mkei');
  if(!date||!amount||amount<=0){toast('日付と金額を入力してください','err');return;}
  const n=nowIso(),id=editingId;
  if(id){const i=S.data.expenses.findIndex(x=>x.id===id);if(i>-1)S.data.expenses[i]={...S.data.expenses[i],date,amount,category,accountId,memo,detail,isKeiei,updatedAt:n};}
  else S.data.expenses.push({id:uid(),date,amount,category,accountId,memo,detail,isKeiei,createdAt:n,updatedAt:n});
  save();closeModal();toast(id?'支出を更新しました':'支出を追加しました','ok');renderPage();
}
function saveI(){
  const date=gv('md'),amount=parseFloat(gv('ma')),category=gv('mc'),accountId=gv('macc'),memo=gv('mm').trim(),isFreelance=gb('mfree'),clientName=gv('mcl').trim();
  if(!date||!amount||amount<=0){toast('日付と金額を入力してください','err');return;}
  const n=nowIso(),id=editingId;
  if(id){const i=S.data.incomes.findIndex(x=>x.id===id);if(i>-1)S.data.incomes[i]={...S.data.incomes[i],date,amount,category,accountId,memo,isFreelance,clientName,updatedAt:n};}
  else S.data.incomes.push({id:uid(),date,amount,category,accountId,memo,isFreelance,clientName,createdAt:n,updatedAt:n});
  save();closeModal();toast(id?'収入を更新しました':'収入を追加しました','ok');renderPage();
}
function saveW(){
  const name=gv('mn').trim(),price=parseFloat(gv('mp'))||0,priority=gv('mpr'),deadline=gv('mdl'),status=gv('mst'),url=gv('mu').trim(),memo=gv('mm').trim();
  if(!name){toast('商品名を入力してください','err');return;}
  const n=nowIso(),id=editingId;
  if(id){const i=S.data.wishlist.findIndex(x=>x.id===id);if(i>-1)S.data.wishlist[i]={...S.data.wishlist[i],name,price,priority,deadline,status,url,memo,updatedAt:n};}
  else S.data.wishlist.push({id:uid(),name,price,priority,deadline,status,url,memo,createdAt:n,updatedAt:n});
  save();closeModal();toast('保存しました','ok');renderPage();
}
function delItem(t,id){
  if(!confirm('削除しますか？'))return;
  if(t==='expense')  S.data.expenses  =S.data.expenses.filter(x=>x.id!==id);
  else if(t==='income')   S.data.incomes   =S.data.incomes.filter(x=>x.id!==id);
  else if(t==='wish')     S.data.wishlist  =S.data.wishlist.filter(x=>x.id!==id);
  else if(t==='acct'){
    if((S.data.incomes.some(x=>x.accountId===id)||S.data.expenses.some(x=>x.accountId===id))&&!confirm('この口座に紐づいた取引があります。続行しますか？'))return;
    S.data.accounts=S.data.accounts.filter(x=>x.id!==id);
  }
  else if(t==='transfer')S.data.transfers =S.data.transfers.filter(x=>x.id!==id);
  save();closeModal();toast('削除しました');renderPage();
}

/* ── Init ── */
function init(){
  loadLocal();
  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.page)));
  nav('home');
  if(S.data.cfg.binId&&S.data.cfg.binKey)setTimeout(pullBin,1500);
}
init();
</script>
