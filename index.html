<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F2EC">
<title>MoneyLog</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Figtree:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:#F5F2EC; --bg2:#EFEBE3; --surface:#FFFFFF; --surface2:#F9F7F4; --surface3:#F0EDE7;
  --border:#E4DFDA; --border2:#D1C9C1;
  --ink:#1C1917; --ink2:#6B645D; --ink3:#A89E96;
  --green:#2C5F3A; --green-lt:#EDF3EF; --green-mid:#C8DDD0;
  --red:#A0291A; --red-lt:#F5ECEA; --red-mid:#E8C4BE;
  --amber:#8A6120; --amber-lt:#F7F0E4; --amber-mid:#DFC99A;
  --blue:#2151A0; --blue-lt:#EBF0F8;
  --purple:#5B4F9A; --purple-lt:#F0EEFB; --purple-mid:#C8C0E8;
  --teal:#1A6B6B; --teal-lt:#E5F3F3;
  --sidebar-w:220px; --nav-h:60px; --mhead-h:50px;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --sh-sm:0 1px 4px rgba(28,25,23,.06),0 2px 10px rgba(28,25,23,.04);
  --sh:0 4px 16px rgba(28,25,23,.08),0 1px 4px rgba(28,25,23,.04);
  --t:.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
input,select,textarea{font-family:'Figtree',sans-serif;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xs);color:var(--ink);padding:9px 12px;font-size:14px;width:100%;outline:none;transition:border-color var(--t),box-shadow var(--t);}
input:focus,select:focus,textarea:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(28,25,23,.07);}
textarea{resize:vertical;min-height:68px;}
select option{background:#fff;}
a{color:var(--green);text-decoration:none;}
a:hover{text-decoration:underline;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* Mobile header */
#mhead{display:none;position:fixed;top:0;left:0;right:0;height:var(--mhead-h);background:var(--surface);border-bottom:1px solid var(--border);z-index:110;padding:0 14px;align-items:center;gap:10px;}
.mhead-logo{display:flex;align-items:center;gap:8px;flex:1;}
.mhead-btn{width:34px;height:34px;border-radius:var(--radius-xs);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink2);cursor:pointer;transition:all var(--t);}
.mhead-btn:hover{background:var(--surface3);color:var(--ink);}

/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);position:fixed;left:0;top:0;bottom:0;z-index:100;display:flex;flex-direction:column;}
.sb-logo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.logo-m{width:30px;height:30px;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:15px;font-weight:700;font-family:'Cormorant Garamond',serif;flex-shrink:0;}
.logo-t{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ink);}
.sb-nav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sb-bot{padding:11px 14px;border-top:1px solid var(--border);}
.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-xs);cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500;transition:all var(--t);user-select:none;}
.nv:hover{background:var(--surface2);color:var(--ink);}
.nv.active{background:var(--ink);color:#fff;}
.ni{font-size:13px;width:18px;text-align:center;flex-shrink:0;}

#main{flex:1;margin-left:var(--sidebar-w);min-height:100vh;}
#content{padding:26px 26px 48px;max-width:940px;width:100%;}

/* Bottom nav */
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);z-index:100;padding:0 2px;justify-content:space-around;align-items:stretch;}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 4px;flex:1;cursor:pointer;color:var(--ink3);font-size:9.5px;font-weight:500;transition:color var(--t);user-select:none;border-radius:8px;margin:4px 1px;}
.bni .bi{font-size:17px;}
.bni.active{color:var(--ink);background:var(--surface3);}

/* FAB */
#fab{position:fixed;bottom:calc(var(--nav-h) + 14px);right:16px;width:46px;height:46px;background:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff;box-shadow:var(--sh);cursor:pointer;z-index:90;transition:all var(--t);user-select:none;}
#fab:hover{transform:scale(1.06);}
#fab:active{transform:scale(.95);}
#fabm{display:none;position:fixed;bottom:calc(var(--nav-h) + 70px);right:16px;flex-direction:column;gap:7px;z-index:89;}
#fabm.open{display:flex;}
.fi{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:8px 15px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--sh-sm);cursor:pointer;transition:all var(--t);animation:fabIn .2s ease;white-space:nowrap;align-self:flex-end;}
@keyframes fabIn{from{opacity:0;transform:scale(.85) translateY(8px);}}
.fi:hover{background:var(--surface2);box-shadow:var(--sh);}

.page{display:none;animation:fadeUp .22s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* Typography */
.serif{font-family:'Cormorant Garamond',serif;}
.mono{font-family:'DM Mono',monospace;}

/* Components */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;}
.pt{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;line-height:1.1;}
.ps{font-size:12.5px;color:var(--ink3);margin-top:3px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;}

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--t);user-select:none;white-space:nowrap;}
.btn-p{background:var(--ink);color:#fff;}
.btn-p:hover{background:#333;box-shadow:var(--sh-sm);}
.btn-g{background:transparent;color:var(--ink2);border:1px solid var(--border2);}
.btn-g:hover{background:var(--surface2);color:var(--ink);}
.btn-d{background:var(--red-lt);color:var(--red);border:1px solid var(--red-mid);}
.btn-d:hover{background:var(--red-mid);}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-xs{padding:3px 9px;font-size:11px;}

.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:100px;font-size:10.5px;font-weight:600;}
.bh{background:var(--red-lt);color:var(--red);border:1px solid var(--red-mid);}
.bm{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-mid);}
.bl{background:var(--blue-lt);color:var(--blue);}
.bd{background:var(--green-lt);color:var(--green);border:1px solid var(--green-mid);}
.bp{background:var(--purple-lt);color:var(--purple);border:1px solid var(--purple-mid);}
.bt{background:var(--teal-lt);color:var(--teal);}

.fg{margin-bottom:12px;}
.fl{font-size:10.5px;font-weight:700;color:var(--ink3);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fh{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5;}
.cb{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:500;}
.cb input{width:auto;}

.amlg{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;letter-spacing:-.5px;line-height:1;}
.pos{color:var(--green);}
.neg{color:var(--red);}

.sr3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.sb{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 11px;}
.sl{font-size:10px;color:var(--ink3);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.sv{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;}
.si{border-left:2px solid var(--green);}
.se{border-left:2px solid var(--red);}
.sg{border-left:2px solid var(--amber);}
.sa{border-left:2px solid var(--purple);}

.txl{display:flex;flex-direction:column;}
.txi{display:flex;align-items:center;gap:10px;padding:9px 5px;cursor:pointer;border-bottom:1px solid var(--border);transition:background var(--t);border-radius:4px;}
.txi:last-child{border-bottom:none;}
.txi:hover{background:var(--surface2);}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tdi{background:var(--green);}
.tde{background:var(--red);}
.tdt{background:var(--blue);}
.tico{width:33px;height:33px;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.tinf{flex:1;min-width:0;}
.tnm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tmt{font-size:11px;color:var(--ink3);margin-top:1px;}
.tam{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:500;flex-shrink:0;}

.mnv{display:flex;align-items:center;gap:7px;}
.mnv button{background:var(--surface);border:1px solid var(--border);color:var(--ink2);padding:5px 9px;border-radius:var(--radius-xs);font-size:13px;cursor:pointer;transition:all var(--t);}
.mnv button:hover{background:var(--surface2);color:var(--ink);}
.mlb{font-size:13px;font-weight:600;min-width:40px;text-align:center;color:var(--ink2);}

.tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:3px;width:fit-content;}
.tab{padding:6px 16px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink3);transition:all var(--t);}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm);}

.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:15px;margin-bottom:12px;}
.gcircle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:26px;flex-shrink:0;}
.gS{background:var(--ink);color:#fff;}
.gA{background:var(--green-lt);color:var(--green);border:2px solid var(--green-mid);}
.gB{background:var(--blue-lt);color:var(--blue);border:2px solid #B8D0EE;}
.gC{background:var(--amber-lt);color:var(--amber);border:2px solid var(--amber-mid);}
.gD{background:var(--red-lt);color:var(--red);border:2px solid var(--red-mid);}
.gi{flex:1;}
.gt{font-size:14px;font-weight:600;margin-bottom:2px;}
.gm{font-size:12.5px;color:var(--ink2);}
.pt2{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:7px;}
.pf{height:100%;border-radius:2px;transition:width .6s ease;}

/* Account cards */
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px;margin-bottom:14px;}
.acct-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow var(--t),transform var(--t);}
.acct-card:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.acct-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.acct-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.acct-name{font-size:14px;font-weight:600;flex:1;}
.acct-type{font-size:11px;color:var(--ink3);}
.acct-bal{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;}
.acct-initial{font-size:11px;color:var(--ink3);margin-top:3px;}

/* Color swatches */
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform var(--t);}
.swatch:hover{transform:scale(1.15);}
.swatch.selected{border-color:var(--ink);transform:scale(1.1);}

/* Transfer item */
.xfr-item{display:flex;align-items:center;gap:10px;padding:9px 5px;border-bottom:1px solid var(--border);}
.xfr-item:last-child{border-bottom:none;}
.xfr-arrow{color:var(--blue);font-size:14px;}

/* Net worth bar */
.nw-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:12px;}

/* Wishlist */
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;}
.wc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;cursor:pointer;transition:box-shadow var(--t),transform var(--t);}
.wc:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.wc.purch{opacity:.55;}
.wn{font-size:14.5px;font-weight:600;margin-bottom:5px;line-height:1.3;}
.wp{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-bottom:7px;}
.wtg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}

/* Charts */
.chwrap{position:relative;width:100%;}
.chwrap canvas{max-height:210px;}

/* Freelance section */
.fl-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.fls-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.fls-label{font-size:10px;color:var(--ink3);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.fls-value{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;}

/* Modal */
#moverlay{display:none;position:fixed;inset:0;background:rgba(28,25,23,.38);backdrop-filter:blur(3px);z-index:200;align-items:flex-end;justify-content:center;}
#moverlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:520px;max-height:94vh;overflow-y:auto;padding:20px 20px 26px;box-shadow:0 -8px 32px rgba(28,25,23,.1);animation:slideUp .28s cubic-bezier(.32,.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%);}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.mt{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;}
.mx{font-size:19px;color:var(--ink3);cursor:pointer;width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:all var(--t);}
.mx:hover{background:var(--surface2);color:var(--ink);}
.ma{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}

/* Chips */
.cscroll{overflow-x:auto;margin-bottom:12px;padding-bottom:3px;}
.chips{display:flex;gap:5px;min-width:max-content;}
.chip{padding:4px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all var(--t);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.chip:hover{border-color:var(--border2);color:var(--ink);background:var(--surface2);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}

/* Source bars */
.srcr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.srcr:last-child{border-bottom:none;}
.sbar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.sbfill{height:100%;background:var(--green);border-radius:2px;transition:width .5s ease;}

/* Settings */
.sts-s{margin-bottom:24px;}
.sts-h{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.ctag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;background:var(--surface2);border:1px solid var(--border);font-size:12px;}
.delbtn{color:var(--ink3);font-size:13px;cursor:pointer;transition:color var(--t);}
.delbtn:hover{color:var(--red);}

/* Sync */
.sync-p{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--ink3);}
.sdot.ok{background:var(--green);}
.sdot.err{background:var(--red);}

/* Toast */
#toasts{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--ink);color:#fff;padding:9px 15px;border-radius:var(--radius-xs);font-size:13px;font-weight:500;box-shadow:var(--sh);animation:toastIn .22s ease;max-width:280px;}
@keyframes toastIn{from{opacity:0;transform:translateX(14px);}}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}

/* Empty */
.emp{text-align:center;padding:40px 20px;}
.eico{font-size:34px;margin-bottom:9px;}
.emsg{font-size:13.5px;font-weight:500;color:var(--ink2);}
.esub{font-size:12px;margin-top:4px;color:var(--ink3);}

/* Spinner */
.spin{width:17px;height:17px;border:2px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg);}}

/* Divider */
.div{height:1px;background:var(--border);margin:12px 0;}

@media(max-width:767px){
  #sidebar{display:none!important;}
  #mhead{display:flex;}
  #main{margin-left:0;}
  #bnav{display:flex;}
  #content{padding:calc(var(--mhead-h) + 14px) 13px 70px;}
  .sr3{gap:7px;}
  .wg{grid-template-columns:1fr 1fr;gap:9px;}
  .fr{grid-template-columns:1fr;gap:0;}
  .pt{font-size:23px;}
  .amlg{font-size:32px;}
  .acct-grid{grid-template-columns:1fr 1fr;}
  .fl-summary{grid-template-columns:1fr 1fr;}
}
@media(max-width:420px){
  .wg{grid-template-columns:1fr;}
  .acct-grid{grid-template-columns:1fr;}
  .fl-summary{grid-template-columns:1fr;}
}
@media(min-width:768px){
  #moverlay{align-items:center;}
  .modal{border-radius:var(--radius);animation:mFd .2s ease;}
  @keyframes mFd{from{opacity:0;transform:scale(.97) translateY(4px);}}
  #fab,#fabm{display:none!important;}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="logo-m">M</div>
      <span class="logo-t">MoneyLog</span>
    </div>
    <div class="sb-nav">
      <div class="nv active" data-page="home"><span class="ni">⊞</span>ホーム</div>
      <div class="nv" data-page="assets"><span class="ni">◫</span>資産・口座</div>
      <div class="nv" data-page="income"><span class="ni">↑</span>収入</div>
      <div class="nv" data-page="expense"><span class="ni">↓</span>支出・経費</div>
      <div class="nv" data-page="report"><span class="ni">◈</span>レポート</div>
      <div class="nv" data-page="wishlist"><span class="ni">◇</span>ほしい物</div>
      <div class="nv" data-page="settings"><span class="ni">◎</span>設定</div>
    </div>
    <div class="sb-bot">
      <div class="sync-p"><div class="sdot" id="sdot"></div><span id="slbl">未同期</span></div>
    </div>
  </nav>

  <div id="main">
    <div id="content">
      <div id="page-home"     class="page active"></div>
      <div id="page-assets"   class="page"></div>
      <div id="page-income"   class="page"></div>
      <div id="page-expense"  class="page"></div>
      <div id="page-report"   class="page"></div>
      <div id="page-wishlist" class="page"></div>
      <div id="page-settings" class="page"></div>
    </div>
  </div>

  <nav id="bnav">
    <div class="bni active" data-page="home"><span class="bi">⊞</span>ホーム</div>
    <div class="bni" data-page="assets"><span class="bi">◫</span>資産</div>
    <div class="bni" data-page="expense"><span class="bi">↓</span>支出</div>
    <div class="bni" data-page="report"><span class="bi">◈</span>レポート</div>
    <div class="bni" data-page="wishlist"><span class="bi">◇</span>ほしい物</div>
  </nav>
</div>

<!-- Mobile header -->
<div id="mhead">
  <div class="mhead-logo">
    <div class="logo-m">M</div>
    <span class="logo-t">MoneyLog</span>
  </div>
  <div class="mhead-btn" onclick="nav('settings')" title="設定">⚙</div>
</div>

<!-- FAB -->
<div id="fab" onclick="toggleFab()">＋</div>
<div id="fabm">
  <div class="fi" onclick="openModal('expense')">↓ 支出を追加</div>
  <div class="fi" onclick="openModal('income')">↑ 収入を追加</div>
  <div class="fi" onclick="openModal('transfer')">⇄ 振替・送金</div>
  <div class="fi" onclick="openModal('wish')">◇ ほしい物を追加</div>
</div>

<div id="moverlay" onclick="oClick(event)">
  <div class="modal" id="mini"></div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const ICONS={食費:'🛒',外食:'🍜',交通費:'🚃',住居費:'🏠',光熱費:'💡',通信費:'📱',医療費:'💊',衣類:'👔',娯楽:'🎮',日用品:'🧴',教育:'📚',貯蓄:'🏦','その他支出':'📦',給与:'💼',副業:'🔧',フリーランス:'💻',投資:'📈','その他収入':'💵','通信費(経費)':'📱','交通費(経費)':'🚃','機材・ソフト':'🖥','書籍・資料':'📚',外注費:'🤝',広告費:'📣',会議費:'☕','その他経費':'📋'};
const ACCT_T={bank:{l:'銀行口座',i:'🏦'},cash:{l:'現金',i:'💴'},ic:{l:'ICカード',i:'🚃'},invest:{l:'投資口座',i:'📈'},credit:{l:'クレジット',i:'💳'},other:{l:'その他',i:'💼'}};
const AC=['#2C5F3A','#2151A0','#8A6120','#A0291A','#5B4F9A','#1A6B6B','#555555','#7A3B1E'];
const DEF_EC=['食費','外食','交通費','住居費','光熱費','通信費','医療費','衣類','娯楽','日用品','教育','貯蓄','その他支出','通信費(経費)','交通費(経費)','機材・ソフト','書籍・資料','外注費','広告費','会議費','その他経費'];
const DEF_IC=['給与','副業','フリーランス','投資','その他収入'];

let S={
  page:'home',vm:new Date(),rp:'month',repTab:'summary',
  fabOpen:false,ef:'all',eKei:false,ifree:false,
  data:{accounts:[],incomes:[],expenses:[],transfers:[],wishlist:[],ec:[...DEF_EC],ic:[...DEF_IC],cfg:{gistId:'',token:''}}
};

/* ─── Storage ─── */
function save(){localStorage.setItem('ml4',JSON.stringify(S.data));autoSync();}
function load(){
  try{const r=localStorage.getItem('ml4');
  if(r){const p=JSON.parse(r);S.data={...S.data,...p};
  if(!S.data.ec?.length)S.data.ec=[...DEF_EC];
  if(!S.data.ic?.length)S.data.ic=[...DEF_IC];
  if(!S.data.cfg)S.data.cfg={gistId:'',token:''};
  if(!S.data.accounts)S.data.accounts=[];
  if(!S.data.transfers)S.data.transfers=[];}}catch(e){}
}
let ast=null;
function autoSync(){const{gistId,token}=S.data.cfg;if(!gistId||!token)return;clearTimeout(ast);ast=setTimeout(()=>pushGist(),6000);}

/* ─── Gist ─── */
async function pullGist(){
  const{gistId,token}=S.data.cfg;if(!gistId||!token){toast('Gist設定が必要です','err');return;}
  setSync('syncing');
  try{const r=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});
  if(!r.ok)throw new Error(r.status);const g=await r.json();const f=g.files['ml-data.json'];
  if(f){const d=JSON.parse(f.content);
    S.data.incomes=mrg(S.data.incomes,d.incomes||[]);
    S.data.expenses=mrg(S.data.expenses,d.expenses||[]);
    S.data.wishlist=mrg(S.data.wishlist,d.wishlist||[]);
    S.data.accounts=mrg(S.data.accounts,d.accounts||[]);
    S.data.transfers=mrg(S.data.transfers,d.transfers||[]);
    if(d.ec)S.data.ec=d.ec;if(d.ic)S.data.ic=d.ic;
    save();setSync('ok');toast('同期しました','ok');renderPage();}}
  catch(e){setSync('err');toast('同期エラー: '+e.message,'err');}
}
async function pushGist(){
  const{gistId,token}=S.data.cfg;if(!gistId||!token)return;setSync('syncing');
  try{await fetch(`https://api.github.com/gists/${gistId}`,{method:'PATCH',
    headers:{Authorization:`token ${token}`,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
    body:JSON.stringify({files:{'ml-data.json':{content:JSON.stringify({incomes:S.data.incomes,expenses:S.data.expenses,wishlist:S.data.wishlist,accounts:S.data.accounts,transfers:S.data.transfers,ec:S.data.ec,ic:S.data.ic},null,2)}}})});
  setSync('ok');}catch(e){setSync('err');}
}
async function newGist(){
  const{token}=S.data.cfg;if(!token){toast('Tokenが必要です','err');return;}
  try{const r=await fetch('https://api.github.com/gists',{method:'POST',
    headers:{Authorization:`token ${token}`,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
    body:JSON.stringify({description:'MoneyLog Data',public:false,files:{'ml-data.json':{content:'{}'}}})});
  const g=await r.json();S.data.cfg.gistId=g.id;save();toast('Gist作成: '+g.id,'ok');renderPage();}
  catch(e){toast('作成エラー','err');}
}
function mrg(loc,rem){const m={};[...loc,...rem].forEach(x=>{if(!m[x.id]||(x.updatedAt||'')>(m[x.id].updatedAt||''))m[x.id]=x;});return Object.values(m).filter(x=>!x._del);}
function setSync(s){const d=document.getElementById('sdot'),l=document.getElementById('slbl');if(!d)return;d.className='sdot';
  if(s==='ok'){d.classList.add('ok');l.textContent='同期済み';l.style.color='var(--green)';}
  else if(s==='err'){d.classList.add('err');l.textContent='エラー';l.style.color='var(--red)';}
  else if(s==='syncing'){l.textContent='同期中…';l.style.color='var(--amber)';}
  else{l.textContent='未同期';l.style.color='var(--ink3)';}}

/* ─── Nav ─── */
function nav(p){S.page=p;closeFab();
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll(`[data-page="${p}"]`).forEach(x=>x.classList.add('active'));
  document.getElementById(`page-${p}`)?.classList.add('active');
  renderPage();window.scrollTo(0,0);}
function renderPage(){switch(S.page){
  case'home':rHome();break;case'assets':rAssets();break;
  case'income':rIncome();break;case'expense':rExpense();break;
  case'report':rReport();break;case'wishlist':rWish();break;case'settings':rSets();break;}}

/* ─── Utils ─── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function yen(n,s=false){const a=Math.abs(Math.round(n));const sg=s&&n>0?'+':n<0?'−':'';return sg+'¥'+a.toLocaleString('ja-JP');}
function today(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function mRng(d){const y=d.getFullYear(),m=d.getMonth();return{s:fmt(new Date(y,m,1)),e:fmt(new Date(y,m+1,0))};}
function wRng(){const dt=new Date(),day=dt.getDay();const mo=new Date(dt);mo.setDate(dt.getDate()-(day===0?6:day-1));const su=new Date(mo);su.setDate(mo.getDate()+6);return{s:fmt(mo),e:fmt(su)};}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function inR(ds,s,e){return ds>=s&&ds<=e;}
function fd(ds){const d=new Date(ds+'T00:00:00');return`${d.getMonth()+1}/${d.getDate()}`;}
function dlText(dl){if(!dl)return null;const diff=Math.ceil((new Date(dl)-new Date())/86400000);if(diff<0)return'期限切れ';if(diff===0)return'今日';if(diff<=7)return`残${diff}日`;if(diff<=30)return`残${Math.ceil(diff/7)}週`;return`残${Math.ceil(diff/30)}ヶ月`;}
function grade(r){
  if(r>=30)return{g:'S',c:'gS',msg:'素晴らしい貯蓄率です！',col:'var(--ink)'};
  if(r>=20)return{g:'A',c:'gA',msg:'良好な管理ができています',col:'var(--green)'};
  if(r>=10)return{g:'B',c:'gB',msg:'まずまず。もう少し頑張ろう',col:'var(--blue)'};
  if(r>=0) return{g:'C',c:'gC',msg:'収支トントン。節約を意識しよう',col:'var(--amber)'};
  return{g:'D',c:'gD',msg:'赤字です。支出を見直しましょう',col:'var(--red)'};}
function ci(c){return ICONS[c]||'📌';}
function emp(ic,msg,sub=''){return`<div class="emp"><div class="eico">${ic}</div><div class="emsg">${msg}</div>${sub?`<div class="esub">${sub}</div>`:''}</div>`;}
function gv(id){return document.getElementById(id)?.value||'';}
function gb(id){return document.getElementById(id)?.checked||false;}
function now_iso(){return new Date().toISOString();}

/* ─── Account helpers ─── */
function acctBal(a){
  const id=a.id;
  const inc=S.data.incomes.filter(x=>x.accountId===id).reduce((s,x)=>s+x.amount,0);
  const exp=S.data.expenses.filter(x=>x.accountId===id).reduce((s,x)=>s+x.amount,0);
  const tin=S.data.transfers.filter(x=>x.toId===id).reduce((s,x)=>s+x.amount,0);
  const tout=S.data.transfers.filter(x=>x.fromId===id).reduce((s,x)=>s+x.amount,0);
  return(a.initialBalance||0)+inc-exp+tin-tout;}
function netWorth(){return S.data.accounts.reduce((s,a)=>s+acctBal(a),0);}
function aIcon(t){return ACCT_T[t]?.i||'💼';}
function aLabel(t){return ACCT_T[t]?.l||'その他';}
function aName(id){return id?S.data.accounts.find(x=>x.id===id)?.name||'−':'−';}

/* ─── Toast ─── */
function toast(msg,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>{el.style.cssText='opacity:0;transform:translateX(14px);transition:all .25s';setTimeout(()=>el.remove(),250);},2800);}

/* ─── FAB ─── */
function toggleFab(){S.fabOpen=!S.fabOpen;document.getElementById('fab').textContent=S.fabOpen?'✕':'＋';document.getElementById('fabm').classList.toggle('open',S.fabOpen);}
function closeFab(){S.fabOpen=false;const f=document.getElementById('fab'),m=document.getElementById('fabm');if(f)f.textContent='＋';if(m)m.classList.remove('open');}
document.addEventListener('click',e=>{if(S.fabOpen&&!e.target.closest('#fab')&&!e.target.closest('#fabm'))closeFab();});

/* ─── Modal ─── */
function openModal(t,id=null){closeFab();document.getElementById('moverlay').classList.add('open');const inn=document.getElementById('mini');
  if(t==='expense')inn.innerHTML=mExp(id);
  else if(t==='income')inn.innerHTML=mInc(id);
  else if(t==='wish')inn.innerHTML=mWish(id);
  else if(t==='acct')inn.innerHTML=mAcct(id);
  else if(t==='transfer')inn.innerHTML=mXfr(id);}
function closeModal(){document.getElementById('moverlay').classList.remove('open');}
function oClick(e){if(e.target===document.getElementById('moverlay'))closeModal();}

/* ─── SELECT helpers ─── */
function acctOptions(sel=''){return`<option value="">− 未設定 −</option>`+S.data.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${aIcon(a.type)} ${a.name}</option>`).join('');}

/* ─── HOME ─── */
function rHome(){
  const rng=mRng(S.vm);
  const inc=S.data.incomes.filter(x=>inR(x.date,rng.s,rng.e));
  const exp=S.data.expenses.filter(x=>inR(x.date,rng.s,rng.e));
  const tI=inc.reduce((s,x)=>s+x.amount,0),tE=exp.reduce((s,x)=>s+x.amount,0),bal=tI-tE;
  const rate=tI>0?Math.round(bal/tI*100):0;const g=grade(rate);
  const nw=netWorth();
  const all=[...inc.map(x=>({...x,type:'income'})),...exp.map(x=>({...x,type:'expense'})),...S.data.transfers.filter(x=>inR(x.date,rng.s,rng.e)).map(x=>({...x,type:'transfer'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const ml=`${S.vm.getFullYear()}年${S.vm.getMonth()+1}月`;
  document.getElementById('page-home').innerHTML=`
    <div class="ph">
      <div><div class="pt">ダッシュボード</div><div class="ps">${ml}</div></div>
      <div class="mnv"><button onclick="chM(-1)">‹</button><span class="mlb">${S.vm.getMonth()+1}月</span><button onclick="chM(1)">›</button></div>
    </div>
    ${S.data.accounts.length>0?`<div class="nw-bar">
      <div class="sl">総資産</div>
      <div class="amlg ${nw>=0?'pos':'neg'}" style="margin-top:5px;margin-bottom:10px;">${yen(nw)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${S.data.accounts.map(a=>{const b=acctBal(a);return`<div style="display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:4px 11px;font-size:12px;"><span>${aIcon(a.type)}</span><span style="font-weight:500;">${a.name}</span><span style="font-family:'DM Mono',monospace;color:${b>=0?'var(--green)':'var(--red)'};">${yen(b)}</span></div>`;}).join('')}</div>
    </div>`:''}
    <div class="card" style="padding:20px 22px;">
      <div class="sl">今月の収支</div>
      <div class="amlg ${bal>=0?'pos':'neg'}" style="margin:7px 0 11px;">${yen(bal)}</div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:5px;">貯蓄率 <strong style="color:${g.col}">${rate}%</strong></div>
      <div class="pt2"><div class="pf" style="width:${Math.max(0,Math.min(100,rate))}%;background:${bal>=0?'var(--green)':'var(--red)'}"></div></div>
    </div>
    <div class="sr3">
      <div class="sb si"><div class="sl">収入</div><div class="sv pos">${yen(tI)}</div></div>
      <div class="sb se"><div class="sl">支出</div><div class="sv neg">${yen(tE)}</div></div>
      <div class="sb sg"><div class="sl">評価</div><div class="sv" style="color:${g.col}">${g.g}</div></div>
    </div>
    <div class="gcard"><div class="gcircle ${g.c}">${g.g}</div><div class="gi"><div class="gt">${ml}の評価</div><div class="gm">${g.msg}</div></div></div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span style="font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;">最近の取引</span>
        <span style="font-size:11px;color:var(--ink3)">${all.length}件</span>
      </div>
      <div class="txl">${all.length===0?emp('📭','まだ記録がありません'):all.map(txRow).join('')}</div>
    </div>`;
}
function txRow(tx){
  const isI=tx.type==='income',isT=tx.type==='transfer';
  const cat=tx.category||'';
  const dotCls=isI?'tdi':isT?'tdt':'tde';
  const amtCol=isI?'pos':isT?'':' neg';
  const amtSign=isI?'+':isT?'⇄':'−';
  const name=isT?`${aName(tx.fromId)} → ${aName(tx.toId)}`:tx.memo||cat;
  const meta=isT?`${fd(tx.date)} · 振替`:`${fd(tx.date)} · ${cat}${tx.accountId?' · '+aName(tx.accountId):''}`;
  const kbadge=tx.isKeiei?'<span class="badge bp" style="font-size:9.5px;padding:1px 5px;margin-left:4px;">経費</span>':'';
  const fbadge=tx.isFreelance?'<span class="badge bt" style="font-size:9.5px;padding:1px 5px;margin-left:4px;">FL</span>':'';
  const modalT=isT?'transfer':tx.type;
  return`<div class="txi" onclick="openModal('${modalT}','${tx.id}')">
    <div class="tdot ${dotCls}"></div>
    <div class="tico">${isT?'⇄':ci(cat)}</div>
    <div class="tinf"><div class="tnm">${name}${kbadge}${fbadge}</div><div class="tmt">${meta}</div></div>
    <div class="tam ${amtCol}">${isT?yen(tx.amount):amtSign+yen(tx.amount)}</div>
  </div>`;}
function chM(d){const dt=new Date(S.vm);dt.setMonth(dt.getMonth()+d);S.vm=dt;renderPage();}

/* ─── ASSETS ─── */
function rAssets(){
  const nw=netWorth();
  const xfrs=S.data.transfers.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  document.getElementById('page-assets').innerHTML=`
    <div class="ph">
      <div><div class="pt">資産・口座</div><div class="ps">総資産 ${yen(nw)}</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-g btn-sm" onclick="openModal('transfer')">⇄ 振替</button>
        <button class="btn btn-p btn-sm" onclick="openModal('acct')">＋ 口座を追加</button>
      </div>
    </div>
    <div class="nw-bar" style="margin-bottom:14px;">
      <div class="sl">総資産</div>
      <div class="amlg ${nw>=0?'pos':'neg'}" style="margin-top:6px;">${yen(nw)}</div>
    </div>
    ${S.data.accounts.length===0?emp('◫','口座がありません','「＋ 口座を追加」から設定してください'):`
    <div class="acct-grid">
      ${S.data.accounts.map(a=>{const bal=acctBal(a);return`<div class="acct-card" onclick="openModal('acct','${a.id}')">
        <div class="acct-head">
          <div class="acct-icon" style="background:${a.color||'#eee'}20;border:1px solid ${a.color||'#ccc'}40;">
            <span style="font-size:18px;">${aIcon(a.type)}</span>
          </div>
          <div><div class="acct-name">${a.name}</div><div class="acct-type">${aLabel(a.type)}</div></div>
        </div>
        <div class="acct-bal ${bal>=0?'pos':'neg'}">${yen(bal)}</div>
        <div class="acct-initial">初期残高: ${yen(a.initialBalance||0)}</div>
      </div>`;}).join('')}
    </div>`}
    ${xfrs.length>0?`<div class="card">
      <div style="font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;">最近の振替</div>
      <div class="txl">${xfrs.map(txRow).join('')}</div>
    </div>`:''}`;
}

/* ─── INCOME ─── */
function rIncome(){
  const rng=mRng(S.vm);
  let items=S.data.incomes.filter(x=>inR(x.date,rng.s,rng.e));
  if(S.ifree)items=items.filter(x=>x.isFreelance);
  items.sort((a,b)=>b.date.localeCompare(a.date));
  const total=S.data.incomes.filter(x=>inR(x.date,rng.s,rng.e)).reduce((s,x)=>s+x.amount,0);
  const flTotal=S.data.incomes.filter(x=>inR(x.date,rng.s,rng.e)&&x.isFreelance).reduce((s,x)=>s+x.amount,0);
  const byC={};items.forEach(x=>{byC[x.category]=(byC[x.category]||0)+x.amount;});
  const ml=`${S.vm.getFullYear()}年${S.vm.getMonth()+1}月`;
  document.getElementById('page-income').innerHTML=`
    <div class="ph">
      <div><div class="pt">収入</div><div class="ps">${ml}</div></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="mnv"><button onclick="chM(-1)">‹</button><span class="mlb">${S.vm.getMonth()+1}月</span><button onclick="chM(1)">›</button></div>
        <button class="btn btn-p btn-sm" onclick="openModal('income')">＋ 追加</button>
      </div>
    </div>
    <div class="sr3" style="margin-bottom:12px;">
      <div class="sb si"><div class="sl">合計収入</div><div class="sv pos">${yen(total)}</div></div>
      <div class="sb sa"><div class="sl">フリーランス</div><div class="sv" style="color:var(--teal)">${yen(flTotal)}</div></div>
      <div class="sb" style="border-left:2px solid var(--ink3)"><div class="sl">その他</div><div class="sv">${yen(total-flTotal)}</div></div>
    </div>
    <div style="display:flex;gap:7px;margin-bottom:12px;">
      <div class="chip ${!S.ifree?'on':''}" onclick="S.ifree=false;rIncome()">すべて</div>
      <div class="chip ${S.ifree?'on':''}" onclick="S.ifree=true;rIncome()">フリーランスのみ</div>
    </div>
    ${Object.keys(byC).length>0?`<div class="card">${Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`
      <div class="srcr">
        <div class="tico" style="width:29px;height:29px;font-size:13px;">${ci(c)}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:13px;font-weight:500;">${c}</span><span style="font-family:'DM Mono',monospace;font-size:12.5px;color:var(--green)">${yen(a)}</span></div>

      ${Object.keys(daily).length>0?`<div class="card"><div style="font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">日別支出</div><div class="chwrap"><canvas id="bc"></canvas></div></div>`:''}

        </div></div>`:''}
      ${exp.length===0&&inc.length===0?emp('◈','この期間の記録がありません'):''}
    `:tab==='freelance'?`
      <div class="fl-summary">
        <div class="fls-box" style="border-left:2px solid var(--teal)"><div class="fls-label">FL収入</div><div class="fls-value" style="color:var(--teal)">${yen(flInc)}</div></div>
        <div class="fls-box" style="border-left:2px solid var(--purple)"><div class="fls-label">経費合計</div><div class="fls-value" style="color:var(--purple)">${yen(keiExp)}</div></div>

function drawBar(daily,rng){const el=document.getElementById('bc');if(!el)return;if(bCh){bCh.destroy();bCh=null;}const labels=[],vals=[],s=new Date(rng.s),e=new Date(rng.e);for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){labels.push(`${d.getMonth()+1}/${d.getDate()}`);vals.push(daily[fmt(d)]||0);}bCh=new Chart(el,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'rgba(160,41,26,.12)',borderColor:'rgba(160,41,26,.45)',borderWidth:1,borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'¥'+ctx.raw.toLocaleString()}}},scales:{x:{ticks:{color:'#A89E96',font:{size:10}},grid:{color:'rgba(0,0,0,.035)'}},y:{ticks:{color:'#A89E96',font:{size:10},callback:v=>'¥'+v.toLocaleString()},grid:{color:'rgba(0,0,0,.035)'}}}}});}
function drawPie(ce){const el=document.getElementById('pc');if(!el)return;if(pCh){pCh.destroy();pCh=null;}const colors=['#2C5F3A','#A0291A','#8A6120','#2151A0','#5B4F9A','#1A6B6B','#555','#7A3B1E'];pCh=new Chart(el,{type:'doughnut',data:{labels:ce.map(([c])=>c),datasets:[{data:ce.map(([,v])=>v),backgroundColor:colors.slice(0,ce.length),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:true,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.label+': ¥'+ctx.raw.toLocaleString()}}}}});}

/* ─── CRUD ─── */
function saveAcct(id){
  const name=gv('aname').trim(),type=gv('atype'),initialBalance=parseFloat(gv('ainit'))||0,color=gv('acol')||AC[0];
  if(!name){toast('口座名を入力してください','err');return;}
  const n=now_iso();
  if(id){const i=S.data.accounts.findIndex(x=>x.id===id);if(i>-1)S.data.accounts[i]={...S.data.accounts[i],name,type,initialBalance,color,updatedAt:n};}
  else S.data.accounts.push({id:uid(),name,type,initialBalance,color,createdAt:n,updatedAt:n});
  save();closeModal();toast(id?'口座を更新しました':'口座を追加しました','ok');renderPage();
}
function saveXfr(id){
  const date=gv('xd'),amount=parseFloat(gv('xa')),fromId=gv('xf'),toId=gv('xt'),memo=gv('xm').trim();
  if(!date||!amount||amount<=0){toast('日付と金額を入力してください','err');return;}
  if(fromId&&toId&&fromId===toId){toast('送金元と送金先が同じです','err');return;}
  const n=now_iso();
  if(id){const i=S.data.transfers.findIndex(x=>x.id===id);if(i>-1)S.data.transfers[i]={...S.data.transfers[i],date,amount,fromId,toId,memo,updatedAt:n};}
  else S.data.transfers.push({id:uid(),date,amount,fromId,toId,memo,createdAt:n,updatedAt:n});
  save();closeModal();toast('振替を記録しました','ok');renderPage();
}
function saveE(id){
  const date=gv('md'),amount=parseFloat(gv('ma')),category=gv('mc'),accountId=gv('macc'),memo=gv('mm').trim(),detail=gv('mdt').trim(),isKeiei=gb('mkei');
  if(!date||!amount||amount<=0){toast('日付と金額を入力してください','err');return;}
  const n=now_iso();
  if(id){const i=S.data.expenses.findIndex(x=>x.id===id);if(i>-1)S.data.expenses[i]={...S.data.expenses[i],date,amount,category,accountId,memo,detail,isKeiei,updatedAt:n};}
  else S.data.expenses.push({id:uid(),date,amount,category,accountId,memo,detail,isKeiei,createdAt:n,updatedAt:n});
  save();closeModal();toast(id?'支出を更新しました':'支出を追加しました','ok');renderPage();
}
function saveI(id){
  const date=gv('md'),amount=parseFloat(gv('ma')),category=gv('mc'),accountId=gv('macc'),memo=gv('mm').trim(),isFreelance=gb('mfree'),clientName=gv('mcl').trim();
  if(!date||!amount||amount<=0){toast('日付と金額を入力してください','err');return;}
  const n=now_iso();
  if(id){const i=S.data.incomes.findIndex(x=>x.id===id);if(i>-1)S.data.incomes[i]={...S.data.incomes[i],date,amount,category,accountId,memo,isFreelance,clientName,updatedAt:n};}
  else S.data.incomes.push({id:uid(),date,amount,category,accountId,memo,isFreelance,clientName,createdAt:n,updatedAt:n});
  save();closeModal();toast(id?'収入を更新しました':'収入を追加しました','ok');renderPage();
}
function saveW(id){
  const name=gv('mn').trim(),price=parseFloat(gv('mp'))||0,priority=gv('mpr'),deadline=gv('mdl'),status=gv('mst'),url=gv('mu').trim(),memo=gv('mm').trim();
  if(!name){toast('商品名を入力してください','err');return;}
  const n=now_iso();
  if(id){const i=S.data.wishlist.findIndex(x=>x.id===id);if(i>-1)S.data.wishlist[i]={...S.data.wishlist[i],name,price,priority,deadline,status,url,memo,updatedAt:n};}
  else S.data.wishlist.push({id:uid(),name,price,priority,deadline,status,url,memo,createdAt:n,updatedAt:n});
  save();closeModal();toast('保存しました','ok');renderPage();
}
function delItem(t,id){
  if(!confirm('削除しますか？'))return;
  if(t==='expense')S.data.expenses=S.data.expenses.filter(x=>x.id!==id);
  else if(t==='income')S.data.incomes=S.data.incomes.filter(x=>x.id!==id);
  else if(t==='wish')S.data.wishlist=S.data.wishlist.filter(x=>x.id!==id);
  else if(t==='acct'){
    if(S.data.incomes.some(x=>x.accountId===id)||S.data.expenses.some(x=>x.accountId===id)){
      if(!confirm('この口座に紐づいた取引があります。それでも削除しますか？'))return;}
    S.data.accounts=S.data.accounts.filter(x=>x.id!==id);}
  else if(t==='transfer')S.data.transfers=S.data.transfers.filter(x=>x.id!==id);
  save();closeModal();toast('削除しました');renderPage();
}

/* ─── INIT ─── */
function init(){
  load();
  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.page)));
  nav('home');
  if(S.data.cfg.gistId&&S.data.cfg.token)setTimeout(pullGist,1200);
}
init();
</script>
